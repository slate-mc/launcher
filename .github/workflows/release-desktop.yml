name: Release desktop

on:
  workflow_dispatch:
    inputs:
      release_notes:
        description: Short release notes shown in the updater
        required: true
        type: string
      channel:
        description: Release channel
        required: true
        default: stable
        type: choice
        options:
          - stable
          - beta
      publish_only:
        description: Publish an already completed signed draft without rebuilding
        required: false
        default: false
        type: boolean
      linux_only:
        description: Rebuild Linux while reusing the completed Windows and Mac draft artifacts
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: slate-desktop-release
  cancel-in-progress: false

jobs:
  build:
    if: ${{ !inputs.publish_only }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.linux_only && '[{"platform":"ubuntu-22.04","args":"--bundles deb,appimage"}]' || '[{"platform":"windows-latest","args":""},{"platform":"ubuntu-22.04","args":"--bundles deb,appimage"},{"platform":"macos-latest","args":"--target aarch64-apple-darwin"},{"platform":"macos-latest","args":"--target x86_64-apple-darwin"}]') }}
    runs-on: ${{ matrix.platform }}
    env:
      SLATE_UPDATER_ENABLED: "1"
      SLATE_UPDATER_PUBLIC_KEY: ${{ vars.TAURI_UPDATER_PUBLIC_KEY }}
      SLATE_DESKTOP_SENTRY_DSN: ${{ vars.SLATE_DESKTOP_SENTRY_DSN }}
      VITE_SENTRY_DSN: ${{ vars.SLATE_DESKTOP_SENTRY_DSN }}
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      SENTRY_ORG: ${{ vars.SENTRY_ORG }}
      SENTRY_PROJECT: ${{ vars.SENTRY_DESKTOP_PROJECT }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
          targets: ${{ startsWith(matrix.platform, 'macos') && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-${{ matrix.platform }}-${{ startsWith(matrix.platform, 'macos') && matrix.args || '' }}
          cache-on-failure: true

      - name: Install Linux desktop dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Prepare signed updater configuration
        run: node tools/write-tauri-release-config.mjs

      - name: Build and stage release
        uses: tauri-apps/tauri-action@v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          tagName: slate-v__VERSION__
          releaseName: slate __VERSION__
          releaseBody: ${{ inputs.release_notes }}
          releaseDraft: true
          prerelease: ${{ inputs.channel == 'beta' }}
          includeUpdaterJson: true
          updaterJsonPreferNsis: true
          args: --config src-tauri/tauri.release.generated.json ${{ matrix.args }}

      - name: Upload native debug information
        if: ${{ env.SENTRY_AUTH_TOKEN != '' && env.SENTRY_ORG != '' && env.SENTRY_PROJECT != '' }}
        run: npx --yes @sentry/cli@3.8.0 debug-files upload target

  publish-r2:
    name: Publish installers and signed updates to R2
    needs: build
    if: ${{ always() && (inputs.publish_only || needs.build.result == 'success') }}
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      AWS_ACCESS_KEY_ID: ${{ secrets.SLATE_R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.SLATE_R2_SECRET_ACCESS_KEY }}
      SLATE_R2_ENDPOINT: ${{ vars.SLATE_R2_ENDPOINT }}
      SLATE_R2_BUCKET: slate-releases
      SLATE_RELEASE_PUBLIC_URL: https://downloads.slatemc.app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Validate publisher
        run: node --test tools/publish-launcher-r2.test.mjs

      - name: Read release version
        id: version
        run: node --input-type=module -e "import fs from 'node:fs'; fs.appendFileSync(process.env.GITHUB_OUTPUT, 'value=' + JSON.parse(fs.readFileSync('apps/desktop/package.json')).version + '\n')"

      - name: Download completed signed release
        run: gh release download "slate-v${{ steps.version.outputs.value }}" --dir tmp/launcher-release

      - name: Publish verified artifacts and update channel
        run: >-
          node tools/publish-launcher-r2.mjs
          --source tmp/launcher-release
          --version '${{ steps.version.outputs.value }}'
          --channel '${{ inputs.channel }}'
