name: Slate Client

on:
  pull_request:
    paths:
      - "client/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - "gradlew"
      - "gradlew.bat"
      - "gradle/**"
      - ".editorconfig"
      - ".github/workflows/client-ci.yml"
  push:
    branches: [main]
    paths:
      - "client/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - "gradlew"
      - "gradlew.bat"
      - "gradle/**"
      - ".editorconfig"
      - ".github/workflows/client-ci.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - uses: gradle/actions/setup-gradle@v4

      - name: Verify Slate Client
        run: ./gradlew clientCheck --no-daemon
